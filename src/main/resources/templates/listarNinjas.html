<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de Ninjas</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #273449;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --info: #0ea5e9;
            --info-hover: #0284c7;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b 0%, var(--bg) 45%);
            color: var(--text);
            padding: 40px 20px;
        }

        h1 {
            max-width: 1200px;
            margin: 0 auto 24px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        table {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            font-size: 0.95rem;
        }

        thead th {
            background: var(--surface-2);
            color: var(--muted);
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(99, 102, 241, 0.08);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .acoes {
            white-space: nowrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            margin-right: 6px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn:last-child {
            margin-right: 0;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-detalhes {
            background: var(--info);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn-detalhes:hover { background: var(--info-hover); }

        .btn-alterar {
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-alterar:hover { background: var(--primary-hover); }

        .btn-deletar {
            background: var(--danger);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        .btn-deletar:hover { background: var(--danger-hover); }

        .sem-missao {
            color: var(--muted);
            font-style: italic;
        }

        tbody td span > span {
            color: #c7d2fe;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 12px;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
<h1>Lista de ninjas</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Idade</th>
        <th>Rank</th>
        <th>Missões</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="ninja : ${ninjas}">
        <td th:text="${ninja.id}"></td>
        <td th:text="${ninja.nome}"></td>
        <td th:text="${ninja.email}"></td>
        <td th:text="${ninja.idade}"></td>
        <td th:text="${ninja.rank}"></td>
        <td>
                    <span th:if="${ninja.missoes != null}">
                        <span th:text="${ninja.missoes.nome}"></span>,
                        Descrição: <span th:text="${ninja.missoes.descricao}"></span>
                    </span>
            <span th:if="${ninja.missoes == null}" class="sem-missao">
                        Sem missões cadastradas para o ninja
                    </span>
        </td>
        <td class="acoes">
            <a class="btn btn-detalhes"
               th:href="@{/ninjas/ui/listar/{id}(id=${ninja.id})}">
            Ver detalhes</a>
            <a class="btn btn-alterar"
               th:href="@{/ninjas/ui/#/{id}(id=${ninja.id})}">Alterar</a>
            <a class="btn btn-deletar"
               th:href="@{/ninjas/ui/deletarId/{id}(id=${ninja.id})}"
               onclick="return confirm('Tem certeza que deseja deletar este ninja?')">Deletar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
